name = "lastfm-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Anonymous usage pings + crash reports (see src/index.ts handleTelemetry).
# The binding must be declared here or `wrangler deploy` silently drops it.
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "lastfm-telemetry"
database_id = "f4ffed14-e788-4ff5-a67e-1d803b924114"
